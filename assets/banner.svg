<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Styles for Dynamic Animations -->
    <style>
      .floating-node {
        animation: float 6s ease-in-out infinite alternate;
      }
      .floating-node-2 {
        animation: floatReverse 7s ease-in-out infinite alternate;
      }
      .pulse-ring {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: dash 20s linear infinite;
      }
      .pill-hover {
        transition: transform 0.3s ease;
      }
      .pill-hover:hover {
        transform: translateY(-4px);
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(14px) rotate(-2deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.98); }
        50% { opacity: 0.6; transform: scale(1.03); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS: Ambient Orbs & Interactive Particle Grid -->
  <g class="pulse-ring" style="transform-origin: 200px 100px;">
    <circle cx="200" cy="100" r="160" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)" />
  </g>
  <g class="pulse-ring" style="transform-origin: 1000px 320px; animation-delay: 1.5s;">
    <circle cx="1000" cy="320" r="190" fill="#a855f7" fill-opacity="0.08" filter="url(#glow)" />
  </g>

  <!-- Dynamic Lexical Graph Network (Syntactic & Semantic Connections) -->
  <g opacity="0.35">
    <path class="flow-path" d="M 80 80 Q 250 160 400 70 T 780 110 T 1120 70" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flow-path" d="M 120 350 Q 300 240 550 340 T 920 280 T 1150 360" fill="none" stroke="#818cf8" stroke-width="1.5" style="animation-duration: 25s; animation-direction: reverse;" />
    <path class="flow-path" d="M 220 380 Q 450 120 700 280 T 1050 160" fill="none" stroke="#c084fc" stroke-width="1.2" style="animation-duration: 18s;" />
  </g>

  <!-- Animated Lexical Semantic Cluster Nodes (Background & Periphery) -->
  <g class="floating-node">
    <!-- Node A: Corpus -->
    <g transform="translate(100, 110)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">CORPUS</text>
    </g>
    <!-- Node B: Concordance -->
    <g transform="translate(1080, 110)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#subtleGlow)" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#818cf8" text-anchor="middle">KWIC</text>
    </g>
  </g>

  <g class="floating-node-2">
    <!-- Node C: Semantics -->
    <g transform="translate(130, 290)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#c084fc" stroke-width="2" filter="url(#subtleGlow)" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#c084fc" text-anchor="middle">VECTORS</text>
    </g>
    <!-- Node D: Syntax Graph -->
    <g transform="translate(1050, 300)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#subtleGlow)" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">PARSER</text>
    </g>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed high contrast, fully readable, perfectly centered) -->
  
  <!-- Category Pill / Badge -->
  <g transform="translate(600, 75)">
    <rect x="-175" y="-16" width="350" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="-145" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#e2e8f0" text-anchor="middle">
      CURATED COMPUTATIONAL LINGUISTICS &amp; NLP
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#primaryTextGrad)" text-anchor="middle" filter="url(#subtleGlow)">
    Lexical Visualization &amp; NLP
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="url(#subTextGrad)" text-anchor="middle">
    State of the Art in Corpus Linguistics, Semantic Atlases, Concordancers &amp; Text Mining
  </text>

  <!-- Informational Feature Pills (Interactive / Static Anchor in Center Foreground) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Corpus Tools -->
    <g transform="translate(-360, 0)" class="pill-hover">
      <rect x="0" y="-18" width="160" height="36" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="80" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">📖 Corpus Analysis</text>
    </g>
    <!-- Pill 2: Lexical Networks -->
    <g transform="translate(-185, 0)" class="pill-hover">
      <rect x="0" y="-18" width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="85" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">🌐 Lexical Networks</text>
    </g>
    <!-- Pill 3: Topic Modeling -->
    <g transform="translate(0, 0)" class="pill-hover">
      <rect x="0" y="-18" width="165" height="36" rx="18" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="82" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">📊 Topic Modeling</text>
    </g>
    <!-- Pill 4: Syntactic Parsing -->
    <g transform="translate(180, 0)" class="pill-hover">
      <rect x="0" y="-18" width="180" height="36" rx="18" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="90" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">🌳 Dependency Parsing</text>
    </g>
  </g>

  <!-- Bottom Ecosystem Summary Bar -->
  <g transform="translate(600, 345)">
    <rect x="-380" y="-18" width="760" height="36" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
      ⚡ Tracking <tspan font-weight="700" fill="#38bdf8">SaaS Analytics</tspan> • <tspan font-weight="700" fill="#818cf8">Open-Source Engines</tspan> • <tspan font-weight="700" fill="#c084fc">Word Atlases</tspan> • <tspan font-weight="700" fill="#34d399">Concordancers</tspan>
    </text>
  </g>
</svg>
